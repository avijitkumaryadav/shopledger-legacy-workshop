<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1370" viewBox="0 0 1800 1370" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger UI, Express server, every route and library module, configuration and JSON data store, followed by the order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#55756b"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#087f5b"/>
    </marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#18352d}
      .title{font-size:34px;font-weight:700;letter-spacing:-.4px}
      .subtitle{font-size:16px;fill:#587269}
      .section{font-size:19px;font-weight:700;letter-spacing:.4px}
      .card{fill:#fff;stroke:#d6e5de;stroke-width:1.5}
      .cardHead{font-size:17px;font-weight:700}
      .body{font-size:14px;fill:#405c52}
      .small{font-size:12px;fill:#557067}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#087f5b}
      .route{fill:#f4faf7;stroke:#cde2d7;stroke-width:1.3}
      .lib{fill:#f9fbfa;stroke:#dce8e2;stroke-width:1.2}
      .flow{fill:#fff;stroke:#acd3c0;stroke-width:1.5}
      .flowHead{font-size:15px;font-weight:700;fill:#087f5b}
      .flowText{font-size:13px;fill:#405c52}
      .wire{fill:none;stroke:#8ba99d;stroke-width:2;marker-end:url(#arrow)}
      .wireStrong{fill:none;stroke:#087f5b;stroke-width:2.5;marker-end:url(#arrowDark)}
      .rule{stroke:#deebe5;stroke-width:1}
    </style>
  </defs>

  <rect width="1800" height="1370" fill="#f5f9f7"/>
  <text x="40" y="54" class="title">ShopLedger · application architecture</text>
  <text x="42" y="82" class="subtitle">UI · Express routes · business modules · JSON persistence · order placement</text>
  <line x1="40" y1="103" x2="1760" y2="103" class="rule"/>

  <text x="40" y="133" class="section">APPLICATION MAP</text>

  <rect x="40" y="151" width="250" height="321" rx="14" class="card"/>
  <rect x="40" y="151" width="250" height="45" rx="14" fill="#e6f4ed"/>
  <path d="M40 182h250v14H40z" fill="#e6f4ed"/>
  <text x="60" y="181" class="cardHead">Browser UI</text>
  <text x="60" y="226" class="mono">public/index.html</text>
  <text x="60" y="254" class="body">POS · orders · Khata · audit</text>
  <text x="60" y="294" class="mono">public/js/app.js</text>
  <text x="60" y="322" class="body">XHR calls to /api routes</text>
  <text x="60" y="362" class="mono">public/css/style.css</text>
  <text x="60" y="390" class="body">Page styling</text>
  <text x="60" y="440" class="small">Cart preview → Place Order</text>

  <path d="M295 309 H326" class="wireStrong"/>

  <rect x="335" y="151" width="250" height="321" rx="14" class="card"/>
  <rect x="335" y="151" width="250" height="45" rx="14" fill="#e6f4ed"/>
  <path d="M335 182h250v14H335z" fill="#e6f4ed"/>
  <text x="355" y="181" class="cardHead">Express application</text>
  <text x="355" y="226" class="mono">server.js</text>
  <text x="355" y="254" class="body">Serves public/</text>
  <text x="355" y="278" class="body">Mounts four routers at /api</text>
  <line x1="355" y1="300" x2="565" y2="300" class="rule"/>
  <text x="355" y="330" class="small">Printable invoice route</text>
  <text x="355" y="354" class="mono">GET /orders/:id/invoice</text>
  <text x="355" y="393" class="body">Uses lib/invoice.js</text>
  <text x="355" y="440" class="small">Port from config.js · default 3000</text>

  <path d="M590 309 H617" class="wireStrong"/>

  <rect x="625" y="151" width="515" height="321" rx="14" class="card"/>
  <rect x="625" y="151" width="515" height="45" rx="14" fill="#e6f4ed"/>
  <path d="M625 182h515v14H625z" fill="#e6f4ed"/>
  <text x="645" y="181" class="cardHead">API routers · routes/</text>
  <rect x="645" y="211" width="230" height="112" rx="10" class="route"/>
  <text x="661" y="237" class="mono">products.js</text>
  <text x="661" y="260" class="small">GET /products · GET /coupons</text>
  <text x="661" y="285" class="small">Uses: store, inventory, tax, coupons</text>
  <rect x="895" y="211" width="225" height="112" rx="10" class="route"/>
  <text x="911" y="237" class="mono">orders.js</text>
  <text x="911" y="260" class="small">List · get · create · cancel</text>
  <text x="911" y="285" class="small">Uses: store, inventory, pricing,</text>
  <text x="911" y="304" class="small">coupons, ledger, orders</text>
  <rect x="645" y="339" width="230" height="112" rx="10" class="route"/>
  <text x="661" y="365" class="mono">customers.js</text>
  <text x="661" y="388" class="small">GET /customers · settle</text>
  <text x="661" y="413" class="small">Uses: store, ledger</text>
  <rect x="895" y="339" width="225" height="112" rx="10" class="route"/>
  <text x="911" y="365" class="mono">reports.js</text>
  <text x="911" y="388" class="small">Dashboard · GST · preview · export</text>
  <text x="911" y="413" class="small">Uses: store, reports, pricing,</text>
  <text x="911" y="432" class="small">coupons · invoice via reports</text>

  <path d="M1145 309 H1171" class="wireStrong"/>
  <rect x="1180" y="151" width="580" height="321" rx="14" class="card"/>
  <rect x="1180" y="151" width="580" height="45" rx="14" fill="#e6f4ed"/>
  <path d="M1180 182h580v14H1180z" fill="#e6f4ed"/>
  <text x="1200" y="181" class="cardHead">Configuration and persistent data</text>
  <rect x="1200" y="218" width="250" height="215" rx="11" class="route"/>
  <text x="1220" y="248" class="mono">config.js</text>
  <text x="1220" y="278" class="body">Shop identity and address</text>
  <text x="1220" y="303" class="body">Port · default GST · HSN slabs</text>
  <text x="1220" y="328" class="body">Coupons · admin key</text>
  <text x="1220" y="390" class="small">Used by server and business modules</text>
  <rect x="1470" y="218" width="270" height="215" rx="11" class="route"/>
  <text x="1490" y="248" class="mono">data/db.json</text>
  <text x="1490" y="278" class="body">Products · orders · customers</text>
  <text x="1490" y="303" class="body">Settlements · audit log · IDs</text>
  <text x="1490" y="350" class="small">Read/written by lib/store.js</text>
  <text x="1490" y="390" class="small">JSON file persistence</text>

  <text x="40" y="520" class="section">LIBRARY MODULES · lib/</text>
  <text x="1760" y="520" text-anchor="end" class="small">Route “Uses” labels show router imports</text>

  <rect x="40" y="541" width="328" height="108" rx="12" class="lib"/>
  <text x="58" y="570" class="mono">coupons.js</text>
  <text x="58" y="598" class="body">Coupon lookup · validation · discounts</text>
  <text x="58" y="625" class="small">Reads coupon rules from config.js</text>

  <rect x="384" y="541" width="328" height="108" rx="12" class="lib"/>
  <text x="402" y="570" class="mono">dates.js</text>
  <text x="402" y="598" class="body">Today · date normalization · fiscal year</text>

  <rect x="728" y="541" width="328" height="108" rx="12" class="lib"/>
  <text x="746" y="570" class="mono">inventory.js</text>
  <text x="746" y="598" class="body">Lookup · sellable stock · checks · reserve</text>
  <text x="746" y="625" class="small">Release · inventory summary</text>

  <rect x="1072" y="541" width="328" height="108" rx="12" class="lib"/>
  <text x="1090" y="570" class="mono">invoice.js</text>
  <text x="1090" y="598" class="body">Invoice figures · printable HTML</text>

  <rect x="1416" y="541" width="344" height="108" rx="12" class="lib"/>
  <text x="1434" y="570" class="mono">ledger.js</text>
  <text x="1434" y="598" class="body">Customer credit · Khata · settlements</text>

  <rect x="40" y="663" width="328" height="108" rx="12" class="lib"/>
  <text x="58" y="692" class="mono">orders.js</text>
  <text x="58" y="720" class="body">Create · find · cancel · list orders</text>

  <rect x="384" y="663" width="328" height="108" rx="12" class="lib"/>
  <text x="402" y="692" class="mono">pricing.js</text>
  <text x="402" y="720" class="body">Subtotal · coupon allocation · GST totals</text>

  <rect x="728" y="663" width="328" height="108" rx="12" class="lib"/>
  <text x="746" y="692" class="mono">reports.js</text>
  <text x="746" y="720" class="body">Dashboard · GST reconciliation</text>

  <rect x="1072" y="663" width="328" height="108" rx="12" class="lib"/>
  <text x="1090" y="692" class="mono">store.js</text>
  <text x="1090" y="720" class="body">Read/write db.json · append audit entries</text>

  <rect x="1416" y="663" width="344" height="108" rx="12" class="lib"/>
  <text x="1434" y="692" class="mono">tax.js</text>
  <text x="1434" y="720" class="body">HSN rates · GST slab · CGST / SGST split</text>

  <text x="40" y="824" class="section">ORDER PLACEMENT · POST /api/orders</text>
  <text x="1760" y="824" text-anchor="end" class="small">Order data is persisted before the 201 response</text>

  <rect x="40" y="846" width="500" height="105" rx="12" class="flow"/>
  <circle cx="68" cy="876" r="15" fill="#087f5b"/>
  <text x="68" y="881" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="94" y="878" class="flowHead">UI sends order</text>
  <text x="60" y="914" class="flowText">public/js/app.js → POST /api/orders</text>

  <path d="M545 899 H575" class="wireStrong"/>
  <rect x="585" y="846" width="500" height="105" rx="12" class="flow"/>
  <circle cx="613" cy="876" r="15" fill="#087f5b"/>
  <text x="613" y="881" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="639" y="878" class="flowHead">Resolve items and check stock</text>
  <text x="605" y="914" class="flowText">routes/orders.js → inventory.find() · check()</text>

  <path d="M1090 899 H1120" class="wireStrong"/>
  <rect x="1130" y="846" width="500" height="105" rx="12" class="flow"/>
  <circle cx="1158" cy="876" r="15" fill="#087f5b"/>
  <text x="1158" y="881" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="1184" y="878" class="flowHead">Validate coupon and calculate totals</text>
  <text x="1150" y="914" class="flowText">coupons.validate() · pricing.computeTotals() · tax.js</text>

  <path d="M1635 899 H1664 V1010 H1635" class="wireStrong"/>
  <rect x="1130" y="978" width="500" height="105" rx="12" class="flow"/>
  <circle cx="1158" cy="1008" r="15" fill="#087f5b"/>
  <text x="1158" y="1013" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="1184" y="1010" class="flowHead">Charge Khata when selected</text>
  <text x="1150" y="1046" class="flowText">ledger.chargeOrderToKhata() · credit limit check</text>

  <path d="M1125 1031 H1095" class="wireStrong"/>
  <rect x="585" y="978" width="500" height="105" rx="12" class="flow"/>
  <circle cx="613" cy="1008" r="15" fill="#087f5b"/>
  <text x="613" y="1013" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
  <text x="639" y="1010" class="flowHead">Reserve stock and create order</text>
  <text x="605" y="1046" class="flowText">inventory.reserve() · orders.add()</text>

  <path d="M580 1031 H550" class="wireStrong"/>
  <rect x="40" y="978" width="500" height="105" rx="12" class="flow"/>
  <circle cx="68" cy="1008" r="15" fill="#087f5b"/>
  <text x="68" y="1013" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text>
  <text x="94" y="1010" class="flowHead">Append audit and persist</text>
  <text x="60" y="1046" class="flowText">store.appendAudit() · store.write() → data/db.json</text>

  <path d="M35 1031 H20 V1178 H40" class="wireStrong"/>
  <rect x="40" y="1110" width="500" height="105" rx="12" class="flow"/>
  <circle cx="68" cy="1140" r="15" fill="#087f5b"/>
  <text x="68" y="1145" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text>
  <text x="94" y="1142" class="flowHead">Return order to browser</text>
  <text x="60" y="1178" class="flowText">HTTP 201 → UI refreshes products, totals, dashboard</text>

  <rect x="585" y="1110" width="1175" height="105" rx="12" fill="#edf7f2" stroke="#c9e2d4" stroke-width="1.3"/>
  <text x="610" y="1145" class="flowHead">Cart preview uses the same pricing path</text>
  <text x="610" y="1180" class="flowText">POST /api/pricing/preview → routes/reports.js → pricing.computeTotals() → tax.js + coupons.js</text>

  <text x="40" y="1280" class="small">Sources: server.js · routes/*.js · lib/*.js · config.js · data/db.json</text>
  <text x="1760" y="1280" text-anchor="end" class="small">ShopLedger · v0.8.4</text>
</svg>
